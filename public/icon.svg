<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer ambient ring -->
  <circle cx="256" cy="256" r="190" stroke="#38bdf8" stroke-width="2" opacity="0.15" fill="none" />
  <circle cx="256" cy="256" r="140" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 8" opacity="0.25" fill="none" />

  <!-- Smooth Cervical to Lumbar Spinal S-Curve -->
  <path d="M 276 130 C 242 165 236 210 262 256 C 288 302 284 345 244 382" 
        stroke="url(#spineGrad)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none" 
        filter="url(#glow)" />

  <!-- Vertebral Discs / Articulation Sensor Nodes -->
  <!-- Cervical -->
  <circle cx="276" cy="130" r="14" fill="#38bdf8" />
  <circle cx="260" cy="165" r="12" fill="#38bdf8" opacity="0.9" />
  <circle cx="248" cy="205" r="13" fill="#60a5fa" />
  
  <!-- Thoracic Anchor (Center with pulse glow) -->
  <circle cx="256" cy="256" r="22" fill="#6366f1" opacity="0.3" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="15" fill="#818cf8" />
  <circle cx="256" cy="256" r="7" fill="#ffffff" />

  <!-- Lumbar & Sacrum -->
  <circle cx="270" cy="305" r="13" fill="#34d399" />
  <circle cx="264" cy="345" r="12" fill="#10b981" opacity="0.9" />
  <circle cx="244" cy="382" r="14" fill="#10b981" />

  <!-- Biometric Pulse waveform accent -->
  <path d="M 160 256 L 210 256 L 225 230 L 245 285 L 260 240 L 275 265 L 290 256 L 352 256" 
        stroke="#ffffff" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.85" 
        fill="none" />
</svg>
